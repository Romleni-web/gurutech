<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - GURUTECH</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-login">

  <div class="login-box">
    <div class="logo">GURU<span>TECH</span></div>
    <h2 style="text-align:center;margin-bottom:8px;font-size:20px">Admin Dashboard</h2>
    <p style="text-align:center;color:#666;font-size:14px;margin-bottom:24px">Sign in to manage your store</p>

    <form id="login-form">
      <div class="form-group">
        <label for="admin-email">Email</label>
        <input type="email" id="admin-email" placeholder="admin@gurutech.co.ke" required value="admin@gurutech.co.ke">
      </div>
      <div class="form-group">
        <label for="admin-password">Password</label>
        <input type="password" id="admin-password" placeholder="Enter password" required value="admin123">
      </div>
      <button type="submit" class="btn btn-primary btn-full" style="margin-top:8px">Sign In</button>
    </form>

    <p style="text-align:center;margin-top:16px;font-size:13px;color:#999">
      Demo: admin@gurutech.co.ke / admin123
    </p>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('admin-email').value;
      const password = document.getElementById('admin-password').value;

      // Simple demo auth (replace with real backend auth)
      if (email === 'admin@gurutech.co.ke' && password === 'admin123') {
        localStorage.setItem('admin_session', JSON.stringify({
          email: email,
          loginTime: new Date().toISOString()
        }));
        window.location.href = 'admin-dashboard.html';
      } else {
        alert('Invalid credentials. Use admin@gurutech.co.ke / admin123');
      }
    });
  </script>
</body>
</html>
